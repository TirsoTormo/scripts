[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argos"
version = "1.0.0"
description = "ARGOS v1 — Network Intelligence & Packet Factory"
requires-python = ">=3.12"
dependencies = [
    "rich",
    "psutil",
    "scapy",
    "requests",
    "pydantic",
]

[project.scripts]
argos = "argos.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["argos"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/argos"]
