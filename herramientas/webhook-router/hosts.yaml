# ======================================================================
# CODETIR CONTAINER CLUSTER REGISTRY (hosts.yaml)
# ======================================================================
# Map target container orchestrator clusters to their validation settings.
# Used by the Node Healthcheck and Healer modules to verify connectivity.
# ======================================================================

hosts:
  # Local Docker Daemon Socket
  local-docker:
    platform: "docker"
    host: "unix:///var/run/docker.sock"
    description: "Local Docker Engine daemon socket"

  # Remote Docker Host
  remote-docker-host-01:
    platform: "docker"
    host: "192.168.1.105"
    port: 22
    username: "docker-admin"
    description: "Production Docker swarm container worker node"

  # Kubernetes Cluster Context (Local Kubeconfig target)
  k8s-local-cluster:
    platform: "kubernetes"
    kubeconfig: "~/.kube/config"
    namespace: "default"
    description: "Development local Kubernetes cluster context"

  # Production Kubernetes Cluster Context
  k8s-prod-cluster:
    platform: "kubernetes"
    kubeconfig: "~/.kube/config-prod"
    namespace: "production"
    description: "Baremetal Kubernetes production HA cluster"
